org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The project lives on a mapped network drive. Gradle's virtual file system
# watching holds handles that SMB won't release promptly, which surfaces as
# intermittent "Unable to delete directory" build failures. Watching is a
# local-disk optimisation only, so turning it off costs nothing here.
org.gradle.vfs.watch=false

# Same root cause, different daemon: the out-of-process Kotlin compiler daemon
# keeps handles on its incremental-compilation cache that SMB does not release
# between builds, so the next build fails trying to clear it. Running the
# compiler inside the Gradle daemon avoids the second process entirely.
# On a local disk this line can be removed.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
