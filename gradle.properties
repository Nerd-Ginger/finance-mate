org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Build reliability on this checkout -------------------------------------
# Builds here intermittently fail with "Unable to delete directory ... Failed to
# delete some children", where Gradle cannot clear its own intermediates.
#
# The usual cause is another process holding handles on files Gradle just wrote
# — on Windows that is typically real-time antivirus scanning or search
# indexing, both of which open files immediately after creation. The settings
# below reduce the number of concurrent writers and the number of processes
# holding handles, which makes the collision far less likely.
#
# They are a mitigation, not a cure. The actual fix is to exclude the project
# and Gradle home directories from real-time scanning, which is a decision for
# whoever owns the machine. On a machine without that interference all three
# lines can be removed for faster builds.
org.gradle.parallel=false
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
