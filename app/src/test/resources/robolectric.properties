# Robolectric emulates Android SDK 34 rather than the project's compileSdk of 36.
#
# Robolectric's SDK 36 sandbox requires Java 21, and this toolchain is Java 17.
# Nothing in these tests depends on API-level behaviour — they render Compose to
# images — so emulating an older SDK costs nothing. Same pin as :core:data.
#
# Raise this once the project moves to Java 21.
sdk=34
