# Robolectric emulates Android SDK 34 in these tests, not the project's
# compileSdk of 36.
#
# Robolectric's SDK 36 sandbox requires Java 21, and the project toolchain is
# Java 17. Nothing here depends on API-level behaviour — these tests exercise
# Room's SQLite schema and the import pipeline — so emulating an older SDK costs
# nothing and keeps the tests runnable on the standard toolchain.
#
# Raise this once the project moves to Java 21.
sdk=34
